name: Build

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.x
      - name: Restore
        run: dotnet restore TheSingularityWorkshop.Ontology.slnx
      - name: Build
        run: dotnet build TheSingularityWorkshop.Ontology.slnx --configuration Release --no-restore --warnaserror
      - name: Test
        run: dotnet test TheSingularityWorkshop.Ontology.slnx --configuration Release --no-build --verbosity normal
      - name: Pack
        run: dotnet pack TheSingularityWorkshop.Ontology.csproj --configuration Release --no-build --output ./artifacts

      - name: Upload NuGet artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ontology-nuget
          path: ./artifacts/*

      - name: Login to NuGet.org
        uses: NuGet/login@v1
        id: login
        with:
          user: TheSingularityWorkshop

      - name: Publish to NuGet.org
        run: dotnet nuget push "./artifacts/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source "https://api.nuget.org/v3/index.json" --skip-duplicate
