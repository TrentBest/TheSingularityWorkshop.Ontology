<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">Ontology semantic resolution flow</title>
<desc id="desc">A semantic concept is addressed, related to another semantic concept, resolved to an owned artifact, and finally manifested as behavior, animation, simulation, or UI.</desc>
<rect width="1200" height="620" fill="#0b1020"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#f4f7fb">
<text x="600" y="55" text-anchor="middle" font-size="32" font-weight="700">From meaning to manifestation</text>
<text x="600" y="86" text-anchor="middle" font-size="17" opacity=".8">The ontology identifies meaning; other systems own the implementation.</text>
<rect x="55" y="145" width="220" height="145" rx="18" fill="#18243d" stroke="#6ea8fe" stroke-width="3"/>
<text x="165" y="190" text-anchor="middle" font-size="21" font-weight="700">Semantic concept</text>
<text x="165" y="230" text-anchor="middle" font-size="14">fish / locomotion / swim</text>
<text x="165" y="258" text-anchor="middle" font-size="13" opacity=".8">meaning</text>
<rect x="335" y="145" width="220" height="145" rx="18" fill="#1d2944" stroke="#8bd5ca" stroke-width="3"/>
<text x="445" y="190" text-anchor="middle" font-size="21" font-weight="700">OntologyAddress</text>
<text x="445" y="230" text-anchor="middle" font-size="13">ontology://100/1.0.0/...</text>
<text x="445" y="258" text-anchor="middle" font-size="13" opacity=".8">identity + version + path</text>
<rect x="615" y="145" width="220" height="145" rx="18" fill="#1d2944" stroke="#e6b85c" stroke-width="3"/>
<text x="725" y="190" text-anchor="middle" font-size="21" font-weight="700">Relationship</text>
<text x="725" y="230" text-anchor="middle" font-size="14">manifests-as</text>
<text x="725" y="258" text-anchor="middle" font-size="13" opacity=".8">explicit mapping</text>
<rect x="895" y="145" width="250" height="145" rx="18" fill="#18243d" stroke="#c7a7ff" stroke-width="3"/>
<text x="1020" y="190" text-anchor="middle" font-size="21" font-weight="700">Owned artifact</text>
<text x="1020" y="230" text-anchor="middle" font-size="14">behavior / animation</text>
<text x="1020" y="258" text-anchor="middle" font-size="13" opacity=".8">repository or provider</text>
<path d="M275 217 H335" stroke="#d9e2f2" stroke-width="4" marker-end="url(#arrow)"/>
<path d="M555 217 H615" stroke="#d9e2f2" stroke-width="4" marker-end="url(#arrow)"/>
<path d="M835 217 H895" stroke="#d9e2f2" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="170" y="385" width="860" height="125" rx="20" fill="#121a2d" stroke="#d9e2f2" stroke-width="2"/>
<text x="600" y="425" text-anchor="middle" font-size="22" font-weight="700">Manifestation</text>
<text x="600" y="462" text-anchor="middle" font-size="16">renderer • simulation • interaction • UI • other application behavior</text>
<text x="600" y="490" text-anchor="middle" font-size="14" opacity=".75">The manifestation consumes resolved meaning; it does not need to own the taxonomy.</text>
<path d="M1020 290 C1020 350 920 350 850 385" fill="none" stroke="#d9e2f2" stroke-width="4" marker-end="url(#arrow)"/>
</g>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#d9e2f2"/></marker></defs>
</svg>