<svg xmlns="http://www.w3.org/2000/svg" width="960" height="650" viewBox="0 0 960 650" role="img" aria-labelledby="title desc">
  <title id="title">The Workshop's canonical nine-layer ontology</title>
  <desc id="desc">Nine ordered semantic classification positions, from Paradigm at the broadest level to Species at the most specific. Relationships, context, manifestations, and nested MicroBundles are shown as orthogonal structures, not additional layers.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#172033"/>
      <stop offset="1" stop-color="#0b1020"/>
    </linearGradient>
    <linearGradient id="layer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#23395d"/>
      <stop offset="1" stop-color="#182943"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect x="1" y="1" width="958" height="648" rx="22" fill="url(#panel)" stroke="#64748b" stroke-opacity=".55"/>
  <text x="40" y="46" fill="#f8fafc" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="700">CANONICAL WORKSHOP CLASSIFICATION</text>
  <text x="40" y="73" fill="#94a3b8" font-family="Segoe UI,Arial,sans-serif" font-size="13">Nine ordered positions · broad frame → specific concept</text>
  <g font-family="Segoe UI,Arial,sans-serif">
    <path d="M73 112 V548" stroke="#38bdf8" stroke-width="2" opacity=".65" filter="url(#glow)"/>
    <g fill="#e2e8f0" font-size="12" text-anchor="middle">
      <circle cx="73" cy="125" r="17" fill="#2563eb"/><text x="73" y="129">0</text>
      <circle cx="73" cy="177" r="17" fill="#2563eb"/><text x="73" y="181">1</text>
      <circle cx="73" cy="229" r="17" fill="#2563eb"/><text x="73" y="233">2</text>
      <circle cx="73" cy="281" r="17" fill="#2563eb"/><text x="73" y="285">3</text>
      <circle cx="73" cy="333" r="17" fill="#2563eb"/><text x="73" y="337">4</text>
      <circle cx="73" cy="385" r="17" fill="#2563eb"/><text x="73" y="389">5</text>
      <circle cx="73" cy="437" r="17" fill="#2563eb"/><text x="73" y="441">6</text>
      <circle cx="73" cy="489" r="17" fill="#2563eb"/><text x="73" y="493">7</text>
      <circle cx="73" cy="541" r="17" fill="#0d9488"/><text x="73" y="545">8</text>
    </g>
    <g fill="url(#layer)" stroke="#60a5fa" stroke-opacity=".7">
      <rect x="115" y="106" width="440" height="38" rx="9"/>
      <rect x="115" y="158" width="440" height="38" rx="9"/>
      <rect x="115" y="210" width="440" height="38" rx="9"/>
      <rect x="115" y="262" width="440" height="38" rx="9"/>
      <rect x="115" y="314" width="440" height="38" rx="9"/>
      <rect x="115" y="366" width="440" height="38" rx="9"/>
      <rect x="115" y="418" width="440" height="38" rx="9"/>
      <rect x="115" y="470" width="440" height="38" rx="9"/>
      <rect x="115" y="522" width="440" height="38" rx="9" stroke="#2dd4bf"/>
    </g>
    <g fill="#f8fafc" font-size="16" font-weight="700">
      <text x="137" y="131">Paradigm</text><text x="137" y="183">Domain</text>
      <text x="137" y="235">Kingdom</text><text x="137" y="287">Phylum</text>
      <text x="137" y="339">Class</text><text x="137" y="391">Order</text>
      <text x="137" y="443">Family</text><text x="137" y="495">Genus</text>
      <text x="137" y="547">Species</text>
    </g>
    <g fill="#94a3b8" font-size="12">
      <text x="585" y="124">Foundational frame</text>
      <text x="585" y="176">Broad field</text>
      <text x="585" y="228">Major family</text>
      <text x="585" y="280">Structural division</text>
      <text x="585" y="332">Shared characteristics</text>
      <text x="585" y="384">Specific organization</text>
      <text x="585" y="436">Closely related group</text>
      <text x="585" y="488">Near-specific kind</text>
      <text x="585" y="540">Terminal classification</text>
    </g>
    <path d="M800 106 H830 V560 H800" fill="none" stroke="#a78bfa" stroke-width="2" stroke-dasharray="5 5"/>
    <text x="850" y="175" fill="#c4b5fd" font-size="13" font-weight="700">ORTHOGONAL</text>
    <text x="850" y="196" fill="#c4b5fd" font-size="13" font-weight="700">STRUCTURES</text>
    <text x="850" y="246" fill="#e2e8f0" font-size="12">Relationships</text>
    <text x="850" y="272" fill="#e2e8f0" font-size="12">Context</text>
    <text x="850" y="298" fill="#e2e8f0" font-size="12">Manifestations</text>
    <text x="850" y="324" fill="#e2e8f0" font-size="12">MicroBundles</text>
    <text x="850" y="350" fill="#e2e8f0" font-size="12">Composition</text>
  </g>
  <text x="40" y="612" fill="#94a3b8" font-family="Segoe UI,Arial,sans-serif" font-size="12">The nine positions classify meaning; they do not limit graph edges, runtime composition depth, or independent ontology schemas.</text>
</svg>
